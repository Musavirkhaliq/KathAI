# Stage 29 Configuration: Omnilingual ASR CTC 300M v2
experiment_id: O29-01
model:
  name: omniASR_CTC_300M_v2
  family: wav2vec2_asr
  arch: 300m_v2
  encoder_layers: 24
  model_dim: 1024
  ffn_dim: 4096
  num_heads: 16
  vocab_size: 10288
  checkpoint_path: experiments/stage29_omnilingual_kashmiri_asr/checkpoints/omni_300m_v2/omniASR-CTC-300M-v2.pt
  tokenizer_path: experiments/stage29_omnilingual_kashmiri_asr/assets/omniASR_tokenizer_written_v2.model

training:
  precision: bf16
  gradient_checkpointing: true
  freeze_encoder_updates: 1000
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 4
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-6
  warmup_steps: 500
  total_steps: 4000
  weight_decay: 0.01
  clip_grad_norm: 1.0
  max_audio_duration_seconds: 20.0
  min_audio_duration_seconds: 0.8
  save_every_steps: 500
  eval_every_steps: 500
  log_every_steps: 25

data:
  train_manifest: experiments/stage29_omnilingual_kashmiri_asr/data/train_manifest_dataset_a.jsonl
  val_disjoint_manifest: experiments/stage29_omnilingual_kashmiri_asr/data/validation_manifest_dev_a_disjoint.jsonl
  val_waaz_manifest: experiments/stage29_omnilingual_kashmiri_asr/data/validation_manifest_dev_b_waaz.jsonl
  test_manifest: experiments/stage29_omnilingual_kashmiri_asr/data/test_manifest.jsonl
